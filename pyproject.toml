[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-recap"
version = "0.3.0"
description = "Local Git activity scanner and daily standup summarizer"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
git-recap = "git_recap.cli:app"
recap = "git_recap.cli:app"

[tool.setuptools.packages.find]
where = ["src"]